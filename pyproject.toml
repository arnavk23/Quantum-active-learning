[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-al"
version = "0.1.0"
description = "A covariance-aware, quantum-inspired uncertainty formalism for active learning, benchmarked against classical baselines on real Materials Project data, with a verified quantum circuit realization."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Arnav Kapoor", email = "arnavkapoor23@iiserb.ac.in" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pymatgen>=2023.8.10",
    "matplotlib>=3.7.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
circuit = ["qiskit>=1.0.0", "qiskit-aer>=0.14.0"]
test = ["pytest>=7.0.0"]

[project.urls]
Repository = "https://github.com/arnavk23/quantum_al"

[tool.setuptools.packages.find]
where = ["src"]
